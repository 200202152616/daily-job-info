<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>每日就业信息</title>
<style>
:root{
  --bg:#f5f6f7; --card:#ffffff; --line:#e6e8eb; --tx:#1b1d21; --tx2:#5f6368; --tx3:#8b9096;
  --blue:#185fa5; --blue-bg:#e6f1fb; --red:#c0392b; --red-bg:#fceceb;
  --green:#0f6e56; --green-bg:#e1f5ee; --amber:#854f0b; --amber-bg:#faeeda;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  font-size:14px;line-height:1.6;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding:14px 16px calc(12px)}
header h1{margin:0;font-size:16px;font-weight:600}
header .sub{font-size:12px;color:var(--tx3);margin-top:2px}
main{padding:12px 12px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.sec-title{font-size:13px;font-weight:600;color:var(--tx2);margin:16px 4px 8px}
.alert{background:var(--red-bg);border:1px solid #f2c4bf;border-radius:12px;padding:14px;margin-bottom:12px}
.alert .tag{display:inline-block;background:var(--red);color:#fff;font-size:11px;border-radius:4px;padding:1px 6px;margin-bottom:6px}
.alert .name{font-size:15px;font-weight:600}
.alert .when{font-size:13px;color:var(--tx2);margin-top:4px}
.days{font-size:26px;font-weight:700;color:var(--red);line-height:1.1}
.days small{font-size:12px;font-weight:400;color:var(--tx2)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.muted{color:var(--tx2);font-size:12px}
.tiny{color:var(--tx3);font-size:11px}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:#eef0f2;color:var(--tx2);margin:3px 4px 0 0}
.badge.b{background:var(--blue-bg);color:var(--blue)}
.badge.g{background:var(--green-bg);color:var(--green)}
.badge.a{background:var(--amber-bg);color:var(--amber)}
.badge.r{background:var(--red-bg);color:var(--red)}
.score{font-size:12px;font-weight:600;color:var(--blue);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:5px 12px;font-size:12px;color:var(--tx2)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.timeline{margin-top:8px}
.tl{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:#c9ced4;margin-top:7px}
.tl.done .dot{background:var(--green)}
.tl.next .dot{background:var(--red)}
.tl .body{flex:1}
.tl .lb{font-size:13px}
.tl.done .lb{color:var(--tx3);text-decoration:line-through}
.tl .dt{font-size:12px;color:var(--tx2)}
.tl .cd{font-size:11px;color:var(--red)}
ul.cond{margin:6px 0 0;padding-left:18px}
ul.cond li{font-size:13px;color:var(--tx2);margin-bottom:3px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:10px}
.tabs div{flex:1;text-align:center;padding:9px 0;font-size:13px;color:var(--tx2);border-bottom:2px solid transparent}
.tabs div.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:30}
.tabbar div{flex:1;text-align:center;padding:9px 0 8px;font-size:11px;color:var(--tx3)}
.tabbar div.on{color:var(--blue)}
.tabbar div .ic{display:block;font-size:17px;line-height:1.2}
.hide{display:none}
.job-t{font-size:14px;font-weight:600}
.job-c{font-size:12px;color:var(--tx2);margin-top:1px}
.sal{color:var(--red);font-weight:600;font-size:13px}
.link{color:var(--blue);font-size:12px;text-decoration:none}
select,input[type=text],input[type=number]{width:100%;border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font-size:14px;background:var(--card);color:var(--tx);font-family:inherit}
label.f{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--tx)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.star{border:0;background:none;font-size:18px;color:#c9ced4;padding:0;line-height:1}
.star.on{color:#e0a800}
.mat{flex:0 0 auto;cursor:pointer;color:#c9ced4;font-size:15px;line-height:1.5;user-select:none;padding:0 2px}
.mat.on{color:var(--green)}
details.card summary{list-style:none;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
.copybox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px dashed var(--line);
  border-radius:8px;padding:8px 10px;margin-top:6px;word-break:break-all}
.empty{text-align:center;color:var(--tx3);font-size:13px;padding:24px 0}
</style>
</head>
<body>

<header>
  <h1>每日就业信息</h1>

<script>
var D = window.APP_DATA;
var LS = {
  get: function(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
var profile = LS.get('profile', D.profile);
var favs = LS.get('favs', []);
var apps = LS.get('apps', {});
var examRegion = '全部';
var examType = '全部';

function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function parse(s){ if(!s) return null; var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function daysTo(s){ var d = parse(s); if(!d) return null; return Math.round((d - today())/86400000); }
function fmt(s){ if(!s) return ''; var p = s.split('-'); return (+p[1]) + '月' + (+p[2]) + '日'; }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function score(job){
  var s = 0, rs = [];
  var ind = profile.industries || [];
  if (ind.indexOf(job.industry) >= 0){ s += 30; rs.push('行业对口 +30'); }
  else rs.push('行业不符（' + job.industry + '）+0');
  var text = (job.title + ' ' + job.desc + ' ' + (job.tags||[]).join(' ')).toUpperCase();
  var hit = (profile.keywords || []).filter(function(k){ return text.indexOf(k.toUpperCase()) >= 0; });
  if (hit.length){ s += 30; rs.push('命中关键词 +30：' + hit.join('、')); }
  else rs.push('未命中关键词 +0');
  var ct = (profile.cities || []).filter(function(c){ return job.city.indexOf(c) >= 0; });
  if (ct.length){ s += 20; rs.push('城市匹配 +20：' + ct.join('、')); }
  else rs.push('城市不在目标清单 +0');
  if (job.salaryMin == null){ s += 10; rs.push('薪资面议，无法比对 +10'); }
  else if (job.salaryMin >= (profile.salaryMin || 0)){ s += 20; rs.push('薪资达门槛 +20'); }
  else rs.push('低于薪资门槛 +0');
  return { s: s, rs: rs };
}

function renderToday(){
  var el = document.getElementById('v-today');
  var all = [];
  D.exam.tracks.forEach(function(t){
    if (t.verdict === 'no') return;
    t.nodes.forEach(function(n){
      var d = daysTo(n.date);
      if (!n.done && d !== null && d >= 0) all.push({ t: t, n: n, d: d });
    });
  });
  all.sort(function(a,b){ return a.d - b.d; });
  var h = '';

  if (all.length){
    var x = all[0];
    h += '<div class="alert"><span class="tag">最近截止</span>' +
      '<div class="row"><div><div class="name">' + esc(x.t.name) + '</div>' +
      '<div class="when">' + esc(x.n.label) + ' · ' + fmt(x.n.date) +
      (x.n.end ? ' 至 ' + fmt(x.n.end) : '') + (x.n.est ? '（预计）' : '') + '</div></div>' +
      '<div class="days">' + x.d + '<small> 天后</small></div></div>' +
      (x.n.note ? '<div class="muted" style="margin-top:6px">' + esc(x.n.note) + '</div>' : '') +
      '</div>';
  }

  var soon = all.filter(function(a){ return a.d <= 40; }).slice(1, 5);
  if (soon.length){
    h += '<div class="card"><div class="sec-title" style="margin:0 0 6px">40 天内的关键节点</div>';
    soon.forEach(function(a){
      h += '<div class="row" style="padding:5px 0;border-top:1px solid var(--line)">' +
        '<div><div style="font-size:13px">' + esc(a.t.name) + ' · ' + esc(a.n.label) + '</div>' +
        '<div class="tiny">' + fmt(a.n.date) + (a.n.est ? '（预计）' : '') + '</div></div>' +
        '<div class="score">' + a.d + ' 天</div></div>';
    });
    h += '</div>';
  }

  var scored = D.jobs.map(function(j){ var r = score(j); return { j: j, r: r }; })
    .sort(function(a,b){ return b.r.s - a.r.s; });
  h += '<div class="sec-title">为你筛选的高价值岗位</div>';
  scored.slice(0,3).forEach(function(x){ h += jobCard(x.j, x.r, true); });

  h += '<div class="sec-title">我的赛道资格自检</div><div class="card">' +
    '<div class="tiny" style="margin-bottom:4px">基于画像：' + esc(D.profile.degree) + ' · ' + esc(D.profile.political) + ' · ' + esc(D.profile.cadre) + '</div>';
  (D.selfCheck || []).forEach(function(c, i){
    var col = c.verdict === 'ok' ? 'g' : (c.verdict === 'check' ? 'a' : 'r');
    var label = c.verdict === 'ok' ? '符合' : (c.verdict === 'check' ? '待确认' : '不符合');
    h += '<div style="padding:8px 0' + (i ? ';border-top:1px solid var(--line)' : '') + '">' +
      '<div class="row"><div style="flex:1;font-size:13px;font-weight:600">' + esc(c.name) + '</div>' +
      '<span class="badge ' + col + '">' + label + '</span></div>' +
      '<div class="muted" style="margin-top:3px">' + esc(c.why) + '</div>' +
      '<div class="tiny" style="margin-top:3px">下一步：' + esc(c.move) + '</div></div>';
  });
  h += '</div>';

  h += '<div class="sec-title">今日摘要</div><div class="card">' +
    '<div class="muted">岗位库 ' + D.jobs.length + ' 条 · 考公赛道 ' + D.exam.tracks.length + ' 条 · 更新于 ' + D.meta.updated + '</div>' +
    '<div class="tiny" style="margin-top:6px">' + esc(D.meta.sourceNote) + '</div></div>';
  el.innerHTML = h;
}

function jobCard(j, r, compact){
  var on = favs.indexOf(j.id) >= 0;
  var h = '<div class="card"><div class="row">' +
    '<div style="flex:1"><div class="job-t">' + esc(j.title) + '</div>' +
    '<div class="job-c">' + esc(j.company) + ' · ' + esc(j.nature) + '</div>' +
    '<div class="job-c"><span class="sal">' + esc(j.salaryText) + '</span> · ' + esc(j.city) + ' · ' + esc(j.degree) + '</div>' +
    (j.deadline ? '<div class="tiny" style="color:var(--red)">报名截止 ' + fmt(j.deadline) + '（还有 ' + daysTo(j.deadline) + ' 天）</div>' : '') +
    '</div>' +
    '<div style="text-align:right"><button class="star' + (on ? ' on' : '') + '" data-fav="' + j.id + '">' + (on ? '★' : '☆') + '</button>' +
    '<div class="score">匹配 ' + r.s + '</div></div></div>';
  (j.tags || []).forEach(function(t){ h += '<span class="badge">' + esc(t) + '</span>'; });
  if (j.industry) h += '<span class="badge b">' + esc(j.industry) + '</span>';
  if (!compact){
    h += '<div class="muted" style="margin-top:8px">' + esc(j.desc) + '</div>';
    h += '<div class="tiny" style="margin-top:8px">评分依据：' + r.rs.map(esc).join('；') + '</div>';
    h += '<div class="row" style="margin-top:10px;align-items:center">' +
      '<a class="link" href="' + esc(j.url) + '" target="_blank" rel="noopener">查看原文（' + esc(j.source) + ' · ' + esc(j.published) + '）</a>' +
      '<select data-app="' + j.id + '" style="width:auto;font-size:12px;padding:5px 8px">' +
      ['未投递','已投递','笔试','面试','offer','已放弃'].map(function(s){
        return '<option' + ((apps[j.id] || '未投递') === s ? ' selected' : '') + '>' + s + '</option>';
      }).join('') + '</select></div>';
  }
  h += '</div>';
  return h;
}

function resumeMatHtml(){
  var matDone = LS.get('matDone', []);
  var total = 0;
  (D.resume && D.resume.groups || []).forEach(function(g){ total += g.items.length; });
  var h = '<div class="card"><div class="job-t">简历与材料准备</div>' +
    '<div class="tiny" style="margin-top:2px">' + esc(D.resume.note) + '</div>' +
    '<div class="tiny" style="margin-top:4px;color:var(--green);font-weight:600">已备齐 ' +
      matDone.length + ' / ' + total + ' 项</div>';
  (D.resume.groups || []).forEach(function(g, gi){
    h += '<div class="sec-title" style="margin:12px 0 2px">' + esc(g.name) + '</div>';
    g.items.forEach(function(it, ii){
      var key = gi + '|' + ii;
      var on = matDone.indexOf(key) >= 0;
      h += '<div class="row" style="padding:3px 0;align-items:flex-start">' +
        '<span class="mat' + (on ? ' on' : '') + '" data-mat="' + key + '">' + (on ? '●' : '○') + '</span>' +
        '<div style="flex:1;font-size:13px;margin-left:6px' +
        (on ? ';color:var(--tx3);text-decoration:line-through' : '') + '">' + esc(it) + '</div></div>';
    });
  });
  if (D.resume.tips && D.resume.tips.length){
    h += '<div class="sec-title" style="margin:12px 0 2px">投递提示</div><ul class="cond" style="margin:0">';
    D.resume.tips.forEach(function(t){ h += '<li>' + esc(t) + '</li>'; });
    h += '</ul>';
  }
  h += '</div>';
  return h;
}

function renderJobs(){
  var el = document.getElementById('v-jobs');
  var list = D.jobs.map(function(j){ return { j: j, r: score(j) }; })
    .sort(function(a,b){ return b.r.s - a.r.s; });
  var h = '<div class="chips">' +
    '<div class="chip on" data-jf="all">全部</div>' +
    '<div class="chip" data-jf="hit">仅看命中关键词</div>' +
    '<div class="chip" data-jf="city">仅看目标城市</div>' +
    '<div class="chip" data-jf="sal">仅看达薪资门槛</div>' +
    '<div class="chip" data-jf="fav">仅看收藏</div></div>';
  h += resumeMatHtml();
  if (!list.length) h += '<div class="empty">暂无岗位</div>';
  list.forEach(function(x){ h += jobCard(x.j, x.r, false); });
  el.innerHTML = h;
}

var jobFilter = 'all';
function applyJobFilter(){
  var el = document.getElementById('v-jobs');
  var list = D.jobs.map(function(j){ return { j: j, r: score(j) }; });
  var text, kw = (profile.keywords || []);
  list = list.filter(function(x){
    text = (x.j.title + ' ' + x.j.desc + ' ' + (x.j.tags||[]).join(' ')).toUpperCase();
    if (jobFilter === 'hit') return kw.some(function(k){ return text.indexOf(k.toUpperCase()) >= 0; });
    if (jobFilter === 'city') return (profile.cities||[]).some(function(c){ return x.j.city.indexOf(c) >= 0; });
    if (jobFilter === 'sal') return x.j.salaryMin != null && x.j.salaryMin >= (profile.salaryMin||0);
    if (jobFilter === 'fav') return favs.indexOf(x.j.id) >= 0;
    return true;
  }).sort(function(a,b){ return b.r.s - a.r.s; });
  var h = '<div class="chips">' +
    ['all:全部','hit:仅看命中关键词','city:仅看目标城市','sal:仅看达薪资门槛','fav:仅看收藏'].map(function(s){
      var p = s.split(':');
      return '<div class="chip' + (jobFilter === p[0] ? ' on' : '') + '" data-jf="' + p[0] + '">' + p[1] + '</div>';
    }).join('') + '</div>';
  h += resumeMatHtml();
  if (!list.length) h += '<div class="empty">当前筛选下没有岗位</div>';
  list.forEach(function(x){ h += jobCard(x.j, x.r, false); });
  el.innerHTML = h;
}

function renderExam(){
  var el = document.getElementById('v-exam');
  var types = ['全部'], regions = ['全部'];
  D.exam.tracks.forEach(function(t){
    if (types.indexOf(t.type) < 0) types.push(t.type);
    if (regions.indexOf(t.region) < 0) regions.push(t.region);
  });
  var h = '<div class="chips">' + regions.map(function(r){
    return '<div class="chip' + (examRegion === r ? ' on' : '') + '" data-er="' + r + '">' + r + '</div>';
  }).join('') + '</div>';
  h += '<div class="tabs">' + types.map(function(t){
    return '<div class="' + (examType === t ? 'on' : '') + '" data-et="' + t + '">' + t + '</div>';
  }).join('') + '</div>';

  var list = D.exam.tracks.filter(function(t){
    var okR = examRegion === '全部' || t.region === examRegion || (examRegion === '全国' && t.region === '全国');
    var okT = examType === '全部' || t.type === examType;
    if (examRegion !== '全部' && examRegion !== '全国') okR = t.region === examRegion;
    return okR && okT;
  });
  if (!list.length) h += '<div class="empty">该组合下暂无赛道</div>';

  list.forEach(function(t){
    var urgent = t.status === 'urgent';
    h += '<div class="card"><div class="row"><div style="flex:1">' +
      '<div class="job-t">' + esc(t.name) + '</div>' +
      '<div class="muted">' + esc(t.head) + '</div></div>' +
      (t.verdict === 'ok' ? '<span class="badge g">符合</span>' :
       t.verdict === 'check' ? '<span class="badge a">待确认</span>' :
       '<span class="badge">不符合</span>') + '</div>';
    h += '<div class="timeline">';
    var pendingFound = false;
    t.nodes.forEach(function(n){
      var d = daysTo(n.date);
      var cls = n.done ? 'done' : (!pendingFound && d !== null && d >= 0 ? 'next' : '');
      if (cls === 'next') pendingFound = true;
      h += '<div class="tl ' + cls + '"><div class="dot"></div><div class="body">' +
        '<div class="lb">' + esc(n.label) + (n.est ? ' <span class="tiny">预计</span>' : '') + '</div>' +
        '<div class="dt">' + fmt(n.date) + (n.end ? ' – ' + fmt(n.end) : '') + '</div>' +
        (n.done ? '' : (d !== null && d >= 0 ? '<div class="cd">还有 ' + d + ' 天</div>' : '<div class="tiny">已过</div>')) +
        (n.note ? '<div class="tiny">' + esc(n.note) + '</div>' : '') +
        '</div></div>';
    });
    h += '</div>';
    if (t.conditions && t.conditions.length){
      h += '<div class="sec-title" style="margin:10px 0 2px">报考条件</div><ul class="cond">';
      t.conditions.forEach(function(c){ h += '<li>' + esc(c) + '</li>'; });
      h += '</ul>';
    }
    if (t.examContent) h += '<div class="muted" style="margin-top:8px">考试内容：' + esc(t.examContent) + '</div>';
    if (t.note) h += '<div class="tiny" style="margin-top:8px">提示：' + esc(t.note) + '</div>';
    h += '<div style="margin-top:10px"><a class="link" href="' + esc(t.official.url) + '" target="_blank" rel="noopener">官方入口：' + esc(t.official.name) + '</a></div>';
    h += '</div>';
  });

  h += '<div class="sec-title">高频踩坑</div><div class="card"><ul class="cond" style="margin:0">';
  D.exam.pitfalls.forEach(function(p){ h += '<li>' + esc(p) + '</li>'; });
  h += '</ul></div>';
  h += '<div class="sec-title">材料清单</div><div class="card"><ul class="cond" style="margin:0">';
  D.exam.materials.forEach(function(m){ h += '<li>' + esc(m) + '</li>'; });
  h += '</ul></div>';

  if (D.articles && D.articles.length){
    var a0 = D.articles[0];
    h += '<div class="sec-title">每日备考（每天一篇）</div>';
    h += '<div class="card"><div class="job-t">' + esc(a0.title) + '</div>' +
      '<div class="tiny" style="margin-top:2px">' + esc(a0.date) + ' · ' + esc(a0.tag) + ' · ' + esc(a0.source) + '</div>' +
      '<ul class="cond" style="margin-top:6px">' +
      a0.points.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
      (a0.link ? '<div style="margin-top:8px"><a class="link" href="' + esc(a0.link) + '" target="_blank" rel="noopener">延伸阅读</a></div>' : '') +
      '</div>';
    if (D.articles.length > 1){
      h += '<div class="sec-title">往期经验贴</div>';
      D.articles.slice(1).forEach(function(a){
        h += '<details class="card"><summary>' +
          '<div class="job-t">' + esc(a.title) + '</div>' +
          '<div class="tiny">' + esc(a.date) + ' · ' + esc(a.tag) + '</div></summary>' +
          '<ul class="cond" style="margin-top:6px">' +
          a.points.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
          (a.link ? '<div style="margin-top:8px"><a class="link" href="' + esc(a.link) + '" target="_blank" rel="noopener">延伸阅读</a></div>' : '') +
          '</details>';
      });
    }
  }
  el.innerHTML = h;
}

function renderSources(){
  var el = document.getElementById('v-sources');
  var h = '';
  if (D.meta.pageUrl){
    h += '<div class="card"><div class="job-t">本页网址（建议加到手机主屏）</div>' +
      '<div class="copybox"><span style="flex:1;font-size:12px" id="pageUrl">' + esc(D.meta.pageUrl) + '</span>' +
      '<button class="btn" data-copy="1" style="flex:0 0 auto">复制</button></div>' +
      '<div class="tiny" style="margin-top:6px">手机浏览器打开后选“添加到主屏幕”，以后点图标直接进，不用记网址。</div></div>';
  }
  h += '<div class="card"><div class="tiny">原则：聚合渠道只用于“发现”，报名、缴费、资格条件一律以官方原文为准；两者冲突时取官方。</div></div>';

  h += '<div class="sec-title">考公官方入口</div><div class="card">';
  var seen = {}, idx = 0;
  D.exam.tracks.forEach(function(t){
    if (seen[t.official.url]) return;
    seen[t.official.url] = 1;
    h += '<div style="padding:9px 0' + (idx++ ? ';border-top:1px solid var(--line)' : '') + '">' +
      '<div style="font-size:13px;font-weight:600">' + esc(t.official.name) + '</div>' +
      '<div class="tiny">适用：' + esc(t.name) + '</div>' +
      '<a class="link" href="' + esc(t.official.url) + '" target="_blank" rel="noopener">' + esc(t.official.url) + '</a></div>';
  });
  h += '</div>';

  (D.sources || []).forEach(function(g){
    h += '<div class="sec-title">' + esc(g.cat) + '</div><div class="card">';
    g.items.forEach(function(it, i){
      h += '<div style="padding:9px 0' + (i ? ';border-top:1px solid var(--line)' : '') + '">' +
        '<div style="font-size:13px;font-weight:600">' + esc(it.name) + '</div>' +
        '<div class="tiny">' + esc(it.note) + '</div>' +
        '<a class="link" href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.url) + '</a></div>';
    });
    h += '</div>';
  });

  h += '<div class="sec-title">岗位原文链接</div><div class="card">';
  D.jobs.forEach(function(j, i){
    h += '<div style="padding:9px 0' + (i ? ';border-top:1px solid var(--line)' : '') + '">' +
      '<div style="font-size:13px;font-weight:600">' + esc(j.title) + '</div>' +
      '<div class="tiny">' + esc(j.company) + ' · ' + esc(j.source) + ' · ' + esc(j.published) + '</div>' +
      '<a class="link" href="' + esc(j.url) + '" target="_blank" rel="noopener">' + esc(j.url) + '</a></div>';
  });
  h += '</div>';

  if (D.articles && D.articles.length){
    h += '<div class="sec-title">经验贴与延伸阅读</div><div class="card">';
    D.articles.forEach(function(a, i){
      h += '<div style="padding:9px 0' + (i ? ';border-top:1px solid var(--line)' : '') + '">' +
        '<div style="font-size:13px;font-weight:600">' + esc(a.title) + '</div>' +
        '<div class="tiny">' + esc(a.date) + ' · ' + esc(a.tag) + ' · ' + esc(a.source) + '</div>' +
        (a.link ? '<a class="link" href="' + esc(a.link) + '" target="_blank" rel="noopener">' + esc(a.link) + '</a>' : '') +
        '</div>';
    });
    h += '</div>';
  }
  el.innerHTML = h;
}

function renderMe(){
  var el = document.getElementById('v-me');
  var h = '<div class="card"><div class="job-t" style="margin-bottom:4px">固定画像（来自简历）</div>' +
    '<div class="muted">' + esc(D.profile.school) + ' · ' + esc(D.profile.degree) + '</div>' +
    '<div class="muted">' + esc(D.profile.political) + '</div>' +
    '<div class="muted">' + esc(D.profile.cadre) + '</div>' +
    '<div class="muted">户籍：' + esc(D.profile.household) + '</div>' +
    '<div class="tiny" style="margin-top:4px">这几项决定选调与辅导员的报考资格，如需修改请改 data.js 中的 profile。</div></div>';
  h += '<div class="card"><div class="job-t" style="margin-bottom:6px">筛选参数（决定岗位评分）</div>';
  h += '<label class="f">目标城市（逗号分隔）</label><input type="text" id="pCities" value="' + esc((profile.cities||[]).join(',')) + '">';
  h += '<label class="f">目标行业（逗号分隔）</label><input type="text" id="pInd" value="' + esc((profile.industries||[]).join(',')) + '">';
  h += '<label class="f">岗位关键词（逗号分隔）</label><input type="text" id="pKw" value="' + esc((profile.keywords||[]).join(',')) + '">';
  h += '<label class="f">薪资门槛（K/月）</label><input type="number" id="pSal" value="' + esc(profile.salaryMin) + '">';
  h += '<div style="margin-top:12px"><button class="btn p" id="saveP">保存并重新筛选</button> ' +
       '<button class="btn" id="resetP">恢复默认</button></div></div>';

  var favJobs = D.jobs.filter(function(j){ return favs.indexOf(j.id) >= 0; });
  h += '<div class="sec-title">收藏的岗位（' + favJobs.length + '）</div>';
  if (!favJobs.length) h += '<div class="card"><div class="empty">还没有收藏</div></div>';
  favJobs.forEach(function(j){ h += jobCard(j, score(j), false); });

  var tracked = Object.keys(apps).filter(function(k){ return apps[k] && apps[k] !== '未投递'; });
  h += '<div class="sec-title">投递跟踪（' + tracked.length + '）</div><div class="card">';
  if (!tracked.length) h += '<div class="empty">还没有记录</div>';
  tracked.forEach(function(id){
    var j = D.jobs.filter(function(x){ return x.id === id; })[0];
    if (j) h += '<div class="row" style="padding:4px 0"><div><div style="font-size:13px">' + esc(j.title) + '</div>' +
      '<div class="tiny">' + esc(j.company) + '</div></div><span class="badge b">' + esc(apps[id]) + '</span></div>';
  });
  h += '</div>';
  el.innerHTML = h;

  document.getElementById('saveP').onclick = function(){
    var sp = function(v){ return v.split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean); };
    var base = JSON.parse(JSON.stringify(profile));
    base.cities = sp(document.getElementById('pCities').value);
    base.industries = sp(document.getElementById('pInd').value);
    base.keywords = sp(document.getElementById('pKw').value);
    base.salaryMin = +document.getElementById('pSal').value || 0;
    profile = base;
    LS.set('profile', profile);
    renderAll();
  };
  document.getElementById('resetP').onclick = function(){
    try{ localStorage.removeItem('profile'); }catch(e){}
    profile = JSON.parse(JSON.stringify(D.profile));
    renderAll();
  };
}

function renderAll(){
  document.getElementById('hdrSub').textContent = '数据更新于 ' + D.meta.updated + ' · 岗位 ' + D.jobs.length + ' 条';
  renderToday(); renderJobs(); renderExam(); renderSources(); renderMe();
}

document.addEventListener('click', function(e){
  var t = e.target;
  var v;
  if (v = t.getAttribute && t.getAttribute('data-v')){
    ['today','jobs','exam','sources','me'].forEach(function(k){
      document.getElementById('v-' + k).classList.toggle('hide', k !== v);
    });
    [].forEach.call(document.querySelectorAll('.tabbar div'), function(d){
      d.classList.toggle('on', d.getAttribute('data-v') === v);
    });
    window.scrollTo(0,0);
    return;
  }
  if (v = t.getAttribute && t.getAttribute('data-fav')){
    var i = favs.indexOf(v);
    if (i >= 0) favs.splice(i,1); else favs.push(v);
    LS.set('favs', favs);
    renderAll();
    return;
  }
  if (v = t.getAttribute && t.getAttribute('data-jf')){ jobFilter = v; applyJobFilter(); return; }
  if (v = t.getAttribute && t.getAttribute('data-er')){ examRegion = v; renderExam(); return; }
  if (v = t.getAttribute && t.getAttribute('data-et')){ examType = v; renderExam(); return; }
  if (v = t.getAttribute && t.getAttribute('data-mat')){
    var matDone = LS.get('matDone', []);
    var k = matDone.indexOf(v);
    if (k >= 0) matDone.splice(k, 1); else matDone.push(v);
    LS.set('matDone', matDone);
    applyJobFilter();
    return;
  }
  if (t.getAttribute && t.getAttribute('data-copy')){
    var u = document.getElementById('pageUrl');
    if (u && navigator.clipboard){
      navigator.clipboard.writeText(u.textContent).then(function(){ t.textContent = '已复制'; });
    }
    return;
  }
});
document.addEventListener('change', function(e){
  var id = e.target.getAttribute && e.target.getAttribute('data-app');
  if (id){ apps[id] = e.target.value; LS.set('apps', apps); renderMe(); }
});

renderAll();
</script>
</body>
</html>
